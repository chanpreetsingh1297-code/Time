<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3D3BF3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDEFF5;--surf:#fff;--ink:#151A2D;--mute:#5B6380;--line:#D9DDEB;--focus:#3D3BF3;--brk:#0E9F6E;--accent:var(--focus);--on:#fff;
--display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1220;--surf:#181C30;--ink:#ECEEFA;--mute:#98A0C4;--line:#2A3050;--focus:#7C83FF;--brk:#3DD6A0;--on:#0F1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1220;--surf:#181C30;--ink:#ECEEFA;--mute:#98A0C4;--line:#2A3050;--focus:#7C83FF;--brk:#3DD6A0;--on:#0F1220;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body.brk{--accent:var(--brk)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.logo{font:700 34px/1 var(--display);letter-spacing:-.03em}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{display:block;font:500 22px/1.1 var(--display)}
.clock span{font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:24px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:999px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;padding:8px 6px;border-radius:999px;color:var(--mute);font-weight:600;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,45,.18)}
.dial{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial circle{fill:none;stroke-width:10}
.trk{stroke:var(--line)}
.bar{stroke:var(--accent);stroke-linecap:round;transition:stroke .3s}
.read{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.read b{font:700 clamp(52px,16vw,68px)/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.read span{color:var(--mute);font-size:14px;margin-top:6px}
.task{display:block;width:100%;margin:22px 0 16px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:center}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.go{min-width:150px;padding:14px 28px;border:0;border-radius:999px;background:var(--accent);color:var(--on);font-weight:700;font-size:17px}
.ico{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:18px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:18px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
h2{font:700 18px/1.2 var(--display);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--bg);border-radius:14px;padding:12px}
.stat b{display:block;font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mute)}
.goal{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:6px 0 4px}
.goal i{display:block;height:100%;width:0;background:var(--focus);transition:width .4s}
.small{font-size:13px;color:var(--mute);margin:0 0 18px}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-bottom:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11.5px;color:var(--mute)}
.col i{display:block;width:100%;max-width:34px;background:var(--focus);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.85}
.col.today i{opacity:1}.col.today{color:var(--ink);font-weight:700}
ul{list-style:none;margin:0;padding:0;max-height:190px;overflow:auto}
li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
li em{font-style:normal;color:var(--mute);white-space:nowrap}
.empty{color:var(--mute);font-size:14px;padding:8px 0}
details{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:600}
.set{display:grid;grid-template-columns:1fr 84px;gap:10px 14px;align-items:center;margin-top:14px;font-size:14px}
.set input[type=number]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.set input[type=checkbox]{justify-self:end;width:20px;height:20px;accent-color:var(--focus)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row button{padding:8px 14px;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Time</div>
    <div class="clock" aria-label="Current time"><b id="now">--:--:--</b><span id="date"></span></div>
  </header>

  <div class="grid">
    <main class="card">
      <div class="tabs" role="group" aria-label="Timer mode">
        <button data-m="focus" aria-pressed="true">Focus</button>
        <button data-m="short" aria-pressed="false">Short break</button>
        <button data-m="long" aria-pressed="false">Long break</button>
      </div>
      <div class="dial">
        <svg viewBox="0 0 260 260" aria-hidden="true"><circle class="trk" cx="130" cy="130" r="120"/><circle class="bar" id="bar" cx="130" cy="130" r="120"/></svg>
        <div class="read"><b id="left" role="timer">25:00</b><span id="state">Ready to focus</span></div>
      </div>
      <input class="task" id="task" maxlength="60" placeholder="What are you working on?" aria-label="Task name">
      <div class="ctl">
        <button class="ico" id="reset" title="Reset (R)" aria-label="Reset timer">↺</button>
        <button class="go" id="go">Start</button>
        <button class="ico" id="skip" title="Skip to next" aria-label="Skip to next session">⏭</button>
      </div>
      <div class="dots" id="dots" aria-label="Sessions until long break"></div>
    </main>

    <aside class="card">
      <h2>Today</h2>
      <div class="stats">
        <div class="stat"><b id="sToday">0m</b><span>Focused today</span></div>
        <div class="stat"><b id="sCount">0</b><span>Sessions</span></div>
        <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
      </div>
      <div class="goal"><i id="goalBar"></i></div>
      <p class="small" id="goalTxt"></p>

      <h2>Last 7 days</h2>
      <div class="chart" id="chart"></div>
      <p class="small" id="avg"></p>

      <h2>Recent sessions</h2>
      <ul id="list"></ul>

      <details>
        <summary>Settings and data</summary>
        <div class="set">
          <label for="sFocus">Focus (min)</label><input type="number" id="sFocus" min="1" max="180">
          <label for="sShort">Short break (min)</label><input type="number" id="sShort" min="1" max="60">
          <label for="sLong">Long break (min)</label><input type="number" id="sLong" min="1" max="90">
          <label for="sGoal">Daily goal (min)</label><input type="number" id="sGoal" min="10" max="720">
          <label for="sAuto">Start next session automatically</label><input type="checkbox" id="sAuto">
          <label for="sSound">Play sound when done</label><input type="checkbox" id="sSound">
        </div>
        <div class="row">
          <button id="theme">Switch theme</button>
          <button id="csv">Export CSV</button>
          <button id="clear">Clear all data</button>
        </div>
      </details>
    </aside>
  </div>
</div>

<script>
(function(){
var K='time.v1',C=2*Math.PI*120;
var $=function(s){return document.querySelector(s)};
var DEF={settings:{focus:25,short:5,long:15,goal:120,auto:false,sound:true},sessions:[],cycle:0,theme:''};
var db;
function load(){try{db=JSON.parse(localStorage.getItem(K))}catch(e){db=null}
  db=db||{};db.settings=Object.assign({},DEF.settings,db.settings||{});db.sessions=db.sessions||[];db.cycle=db.cycle||0;db.theme=db.theme||''}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
load();

var mode='focus',dur=0,left=0,endAt=null;
var NAMES={focus:'Focus',short:'Short break',long:'Long break'};
function mins(m){return db.settings[m]*60}
function setMode(m,keepRun){mode=m;dur=left=mins(m);endAt=null;
  document.body.classList.toggle('brk',m!=='focus');
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===m)});
  render()}
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function p2(n){return n<10?'0'+n:''+n}

function start(){if(endAt)return;endAt=Date.now()+left*1000;
  if('Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission()}catch(e){}}
  render()}
function pause(){if(!endAt)return;left=Math.max(0,Math.ceil((endAt-Date.now())/1000));endAt=null;render()}
function toggle(){endAt?pause():start()}
function reset(){endAt=null;left=dur;render()}
function next(){var n=mode==='focus'?((db.cycle%4===0&&db.cycle>0)?'long':'short'):'focus';setMode(n)}

function beep(){if(!db.settings.sound)return;try{var A=window.AudioContext||window.webkitAudioContext,a=new A();
  [0,.22,.44].forEach(function(t,i){var o=a.createOscillator(),g=a.createGain();o.frequency.value=i===2?880:660;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.18,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.18);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}}
function complete(){
  var wasFocus=mode==='focus';
  if(wasFocus){db.sessions.push({t:Date.now(),m:db.settings.focus,task:$('#task').value.trim()});db.cycle++;if(db.sessions.length>2000)db.sessions.shift();save()}
  beep();
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(wasFocus?'Focus session done':'Break over',{body:wasFocus?'Time for a break.':'Ready for the next focus session?'})}catch(e){}
  var auto=db.settings.auto;next();if(auto)start();
}

function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function stats(){
  var by={};db.sessions.forEach(function(s){var k=dkey(s.t);by[k]=(by[k]||0)+s.m});
  var days=[],i,d;
  for(i=6;i>=0;i--){d=new Date();d.setDate(d.getDate()-i);days.push({k:dkey(d),l:d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,3),v:by[dkey(d)]||0,today:i===0})}
  var streak=0;d=new Date();if(!by[dkey(d)])d.setDate(d.getDate()-1);
  while(by[dkey(d)]){streak++;d.setDate(d.getDate()-1)}
  var todayN=db.sessions.filter(function(s){return dkey(s.t)===dkey(Date.now())}).length;
  return{days:days,today:by[dkey(Date.now())]||0,count:todayN,streak:streak}
}
function hm(m){return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

function renderStats(){
  var st=stats();
  $('#sToday').textContent=hm(st.today);$('#sCount').textContent=st.count;$('#sStreak').textContent=st.streak;
  var g=db.settings.goal;$('#goalBar').style.width=Math.min(100,st.today/g*100)+'%';
  $('#goalTxt').textContent=st.today>=g?'Daily goal reached. '+hm(st.today)+' of '+hm(g)+'.':hm(Math.max(0,g-st.today))+' left to reach your '+hm(g)+' goal.';
  var max=Math.max.apply(null,st.days.map(function(d){return d.v}).concat([30]));
  $('#chart').innerHTML=st.days.map(function(d){return '<div class="col'+(d.today?' today':'')+'" title="'+d.v+' min"><i style="height:'+Math.max(3,d.v/max*92)+'%"></i>'+d.l+'</div>'}).join('');
  var tot=st.days.reduce(function(a,d){return a+d.v},0);
  $('#avg').textContent=tot?'Average '+hm(Math.round(tot/7))+' per day this week.':'Complete a focus session to see your week.';
  var rec=db.sessions.slice(-12).reverse();
  $('#list').innerHTML=rec.length?rec.map(function(s){var d=new Date(s.t);
    return '<li><span>'+(s.task?esc(s.task):'Untitled focus')+'</span><em>'+s.m+' min · '+(dkey(s.t)===dkey(Date.now())?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' ')+p2(d.getHours())+':'+p2(d.getMinutes())+'</em></li>'}).join(''):'<div class="empty">No sessions yet. Start the timer and your focus time will be logged here.</div>';
}
function render(){
  $('#left').textContent=fmt(left);
  $('#bar').style.strokeDasharray=C;$('#bar').style.strokeDashoffset=C*(1-(dur?left/dur:0));
  $('#go').textContent=endAt?'Pause':(left<dur?'Resume':'Start');
  $('#state').textContent=endAt?(mode==='focus'?'Stay with it':'Rest up'):(left<dur?'Paused':(mode==='focus'?'Ready to focus':NAMES[mode]));
  var c=db.cycle%4;$('#dots').innerHTML=[0,1,2,3].map(function(i){return '<i class="'+(i<c?'on':'')+'"></i>'}).join('');
  document.title=(endAt?fmt(left)+' · ':'')+'Time';
  renderStats();
}

function tick(){
  var n=new Date();
  $('#now').textContent=p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds());
  $('#date').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  if(endAt){var l=Math.ceil((endAt-Date.now())/1000);
    if(l<=0){left=0;endAt=null;complete()}
    else if(l!==left){left=l;$('#left').textContent=fmt(l);document.title=fmt(l)+' · Time'}}
}

function applyTheme(){if(db.theme)document.documentElement.setAttribute('data-theme',db.theme);else document.documentElement.removeAttribute('data-theme')}

// events
$('#go').onclick=toggle;$('#reset').onclick=reset;$('#skip').onclick=function(){if(mode==='focus'&&left<dur){}next()};
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});
document.addEventListener('keydown',function(e){var t=e.target.tagName;if(t==='INPUT'||t==='BUTTON'||t==='SUMMARY')return;
  if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='r'||e.key==='R')reset()});
var map={sFocus:'focus',sShort:'short',sLong:'long',sGoal:'goal'};
Object.keys(map).forEach(function(id){var el=$('#'+id);el.value=db.settings[map[id]];
  el.onchange=function(){var v=Math.max(+el.min,Math.min(+el.max,Math.round(+el.value)||db.settings[map[id]]));el.value=v;db.settings[map[id]]=v;save();
    if(!endAt&&left===dur&&map[id]===mode){dur=left=mins(mode)}else if(!endAt&&left===dur){}render()}});
$('#sAuto').checked=db.settings.auto;$('#sSound').checked=db.settings.sound;
$('#sAuto').onchange=function(e){db.settings.auto=e.target.checked;save()};
$('#sSound').onchange=function(e){db.settings.sound=e.target.checked;save()};
$('#theme').onclick=function(){var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!db.theme&&matchMedia('(prefers-color-scheme: dark)').matches);db.theme=dark?'light':'dark';save();applyTheme()};
$('#csv').onclick=function(){var rows=['date,time,minutes,task'].concat(db.sessions.map(function(s){var d=new Date(s.t);return [d.toISOString().slice(0,10),p2(d.getHours())+':'+p2(d.getMinutes()),s.m,'"'+(s.task||'').replace(/"/g,'""')+'"'].join(',')}));
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.join('\n'));a.download='time-sessions.csv';document.body.appendChild(a);a.click();a.remove()};
$('#clear').onclick=function(){if(confirm('Delete all saved sessions and settings? This cannot be undone.')){try{localStorage.removeItem(K)}catch(e){}load();
  Object.keys(map).forEach(function(id){$('#'+id).value=db.settings[map[id]]});$('#sAuto').checked=db.settings.auto;$('#sSound').checked=db.settings.sound;applyTheme();setMode('focus')}};

function frame(){if(endAt){var ms=Math.max(0,endAt-Date.now());$('#bar').style.strokeDashoffset=C*(1-ms/(dur*1000))}requestAnimationFrame(frame)}
applyTheme();setMode('focus');tick();setInterval(tick,250);requestAnimationFrame(frame);
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body>
</html>
